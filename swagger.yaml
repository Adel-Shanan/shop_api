openapi: 3.0.0

info:
  title: Shop API
  version: 1.0.0
  description: |
    REST API for the Shop application.

    This API provides:
    - Product browsing
    - Product management for authenticated users
    - User registration
    - User login and JWT authentication

servers:
  - url: http://localhost:3000
    description: Local development

  - url: https://shop-api-tan.vercel.app
    description: Production


tags:
  - name: Shop
    description: Public shop endpoints

  - name: Auth
    description: User authentication endpoints

  - name: Admin
    description: Authenticated product management endpoints


components:

  securitySchemes:

    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Enter your JWT token.

        Example:
        Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...


  schemas:

    Product:
      type: object
      description: Product object returned by the API
      properties:

        _id:
          type: string
          description: MongoDB ObjectId of the product
          example: "66f123456789abcdef123456"

        title:
          type: string
          description: Product title
          example: "Gaming Laptop"

        price:
          type: number
          description: Product price
          example: 1299.99

        description:
          type: string
          description: Product description
          example: "High-performance gaming laptop"

        imageUrl:
          type: string
          format: uri
          description: URL of the product image stored on Cloudinary
          example: "https://res.cloudinary.com/example/image/upload/v123/products/laptop.jpg"

        imagePublicId:
          type: string
          description: Cloudinary public ID of the product image
          example: "products/laptop_abc123"

        userId:
          type: string
          description: MongoDB ObjectId of the user who created the product
          example: "66f987654321abcdef654321"

      required:
        - _id
        - title
        - price
        - description
        - imageUrl
        - userId


    Error:
      type: object
      description: Standard error response returned by the API
      properties:

        message:
          type: string
          description: Error message
          example: "Validation failed, entered data is not correct"

        data:
          type: array
          description: Additional validation error information when available
          items:
            type: object
            properties:
              type:
                type: string
                example: "field"

              value:
                type: string
                example: "invalid"

              msg:
                type: string
                example: "Please enter a valid value"

              path:
                type: string
                example: "email"

              location:
                type: string
                example: "body"


    UserRegistrationResponse:
      type: object
      properties:

        message:
          type: string
          example: "User created!"

        userId:
          type: string
          description: MongoDB ObjectId of the newly created user
          example: "66f987654321abcdef654321"


    LoginResponse:
      type: object
      properties:

        token:
          type: string
          description: JWT authentication token
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

        userId:
          type: string
          description: MongoDB ObjectId of the authenticated user
          example: "66f987654321abcdef654321"


    ProductsResponse:
      type: object
      properties:

        message:
          type: string
          example: "Fetched Products successfully"

        products:
          type: array
          items:
            $ref: '#/components/schemas/Product'

        totalItems:
          type: integer
          description: Total number of products
          example: 10

        currentPage:
          type: integer
          description: Current page number
          example: 1

        itemsPerPage:
          type: integer
          description: Number of products returned per page
          example: 1

        totalPages:
          type: integer
          description: Total number of pages
          example: 10


    AdminProductsResponse:
      type: object
      properties:

        message:
          type: string
          example: "Fetched Products successfully"

        products:
          type: array
          items:
            $ref: '#/components/schemas/Product'

        totalItems:
          type: integer
          description: Number of products owned by the authenticated user
          example: 5


paths:

  /:

    get:
      tags:
        - Shop

      summary: Get paginated products

      description: |
        Returns a paginated list of products.

        The page number can be provided using the `page` query parameter.

        If no page is provided, page 1 is used.

      parameters:

        - name: page
          in: query
          required: false
          description: Page number
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 1

      responses:

        '200':
          description: Products fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductsResponse'

        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'


  /products:

    get:
      tags:
        - Shop

      summary: Get paginated products

      description: |
        Returns a paginated list of products.

        The page number can be provided using the `page` query parameter.

        If no page is provided, page 1 is used.

      parameters:

        - name: page
          in: query
          required: false
          description: Page number
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 1

      responses:

        '200':
          description: Products fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductsResponse'

        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'


  /products/{productId}:

    get:
      tags:
        - Shop

      summary: Get a single product

      description: |
        Returns a single product using its MongoDB ObjectId.

      parameters:

        - name: productId
          in: path
          required: true
          description: MongoDB ObjectId of the product
          schema:
            type: string
          example: "66f123456789abcdef123456"

      responses:

        '200':
          description: Product fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:

                  message:
                    type: string
                    example: "Product Fetched"

                  product:
                    $ref: '#/components/schemas/Product'

        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'


  /signup:

    put:
      tags:
        - Auth

      summary: Create a new user account

      description: |
        Creates a new user account.

        The email must be valid and must not already exist.

        The password must:
        - contain at least 5 characters
        - contain only alphanumeric characters

        `confirmPassword` must match `password`.

      requestBody:
        required: true

        content:

          application/json:

            schema:
              type: object

              required:
                - email
                - password
                - confirmPassword

              properties:

                email:
                  type: string
                  format: email
                  description: User email address
                  example: "john@example.com"

                password:
                  type: string
                  format: password
                  minLength: 5
                  description: User password
                  example: "password123"

                confirmPassword:
                  type: string
                  format: password
                  minLength: 5
                  description: Must match the password
                  example: "password123"

      responses:

        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRegistrationResponse'

        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'


  /login:

    post:
      tags:
        - Auth

      summary: Login user

      description: |
        Authenticates a user using email and password.

        If the credentials are correct, the API returns a JWT token.

        The token expires after 1 hour.

      requestBody:
        required: true

        content:

          application/json:

            schema:
              type: object

              required:
                - email
                - password

              properties:

                email:
                  type: string
                  format: email
                  description: User email address
                  example: "john@example.com"

                password:
                  type: string
                  format: password
                  minLength: 5
                  description: User password
                  example: "password123"

      responses:

        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'

        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'


  /admin/products:

    get:
      tags:
        - Admin

      summary: Get products created by the authenticated user

      description: |
        Returns all products created by the currently authenticated user.

        Authentication is required.

      security:
        - bearerAuth: []

      responses:

        '200':
          description: Products fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProductsResponse'

        '401':
          description: Authentication required or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'


  /admin/add-product:

    post:
      tags:
        - Admin

      summary: Create a new product

      description: |
        Creates a new product for the authenticated user.

        Authentication is required.

        The request must use `multipart/form-data` because an image file
        is uploaded together with the product data.

        The image is uploaded to Cloudinary.

      security:
        - bearerAuth: []

      requestBody:
        required: true

        content:

          multipart/form-data:

            schema:
              type: object

              required:
                - title
                - price
                - description
                - image

              properties:

                title:
                  type: string
                  minLength: 3
                  description: Product title
                  example: "Gaming Laptop"

                price:
                  type: number
                  format: float
                  description: Product price
                  example: 1299.99

                description:
                  type: string
                  minLength: 5
                  maxLength: 400
                  description: Product description
                  example: "High-performance gaming laptop"

                image:
                  type: string
                  format: binary
                  description: Product image file

      responses:

        '201':
          description: Product created successfully
          content:
            application/json:
              schema:
                type: object

                properties:

                  message:
                    type: string
                    example: "a product has been created!"

                  product:
                    $ref: '#/components/schemas/Product'

        '401':
          description: Authentication required or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '422':
          description: Validation failed or no image was provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'


  /admin/edit-product/{productId}:

    put:
      tags:
        - Admin

      summary: Edit an existing product

      description: |
        Updates an existing product.

        Authentication is required.

        The authenticated user must be the owner of the product.

        The request uses `multipart/form-data`.

        The image is optional. If a new image is provided,
        the old Cloudinary image is deleted and replaced.

      security:
        - bearerAuth: []

      parameters:

        - name: productId
          in: path
          required: true
          description: MongoDB ObjectId of the product to edit
          schema:
            type: string
          example: "66f123456789abcdef123456"

      requestBody:
        required: true

        content:

          multipart/form-data:

            schema:
              type: object

              required:
                - title
                - price
                - description

              properties:

                title:
                  type: string
                  minLength: 3
                  description: Updated product title
                  example: "Updated Gaming Laptop"

                price:
                  type: number
                  format: float
                  description: Updated product price
                  example: 1199.99

                description:
                  type: string
                  minLength: 5
                  maxLength: 400
                  description: Updated product description
                  example: "Updated high-performance gaming laptop"

                image:
                  type: string
                  format: binary
                  description: Optional new product image

      responses:

        '200':
          description: Product updated successfully
          content:
            application/json:
              schema:
                type: object

                properties:

                  message:
                    type: string
                    example: " Post updated!"

                  product:
                    $ref: '#/components/schemas/Product'

        '401':
          description: Authentication required or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '403':
          description: User is not authorized to edit this product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'


  /admin/product/{productId}:

    delete:
      tags:
        - Admin

      summary: Delete a product

      description: |
        Deletes a product.

        Authentication is required.

        Only the user who created the product can delete it.

        The product image is also deleted from Cloudinary.

        The product is also removed from the user's cart if it exists there.

      security:
        - bearerAuth: []

      parameters:

        - name: productId
          in: path
          required: true
          description: MongoDB ObjectId of the product to delete
          schema:
            type: string
          example: "66f123456789abcdef123456"

      responses:

        '200':
          description: Product deleted successfully
          content:
            application/json:
              schema:
                type: object

                properties:

                  message:
                    type: string
                    example: "Product deleted successfully"

        '401':
          description: Authentication required or user could not be found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '403':
          description: User is not authorized to delete this product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'